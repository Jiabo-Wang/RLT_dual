[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-rlt"
version = "0.1.0"
description = "Evo-RLT: RL Token wrapper and LeRobot integration for real-world robot RL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
lerobot = [
    "lerobot[pi] @ https://github.com/huggingface/lerobot/archive/refs/tags/v0.5.1.tar.gz",
    "safetensors>=0.4.3",
    "packaging>=24.0",
    "evdev>=1.7",
    "feetech-servo-sdk>=1.0.0",
]
# CRP dual-arm follower. The native CrpRobotPy/libRobotService/license.key trio is
# not pip-installable — see README_crp_dual.md.
crp = [
    "scipy>=1.11",  # mappers.so101_urdf rotation math
]
# No placo/pinocchio here on purpose. The only kinematics this project needs is SO101
# *leader* FK — the CRP controller runs its own IK on the GP channel — so
# mappers.urdf_fk computes it directly instead of pulling in ~38 native packages whose
# cmeel-boost pin also fights LeRobot's numpy<2.3 requirement. tests/crp/test_urdf_fk.py
# cross-checks against placo whenever it happens to be installed.
test = ["pytest>=8.1", "pytest-timeout>=2.4"]
wandb = ["wandb>=0.16"]
dev = ["evo-rlt[lerobot,test,wandb]", "ruff>=0.6"]

[project.scripts]
evo-rlt-build-transition-cache = "evo_rlt.cli.build_transition_cache:main"
evo-rlt-build-bucket-cache = "evo_rlt.cli.build_bucket_cache:main"
evo-rlt-build-transition-cache-v2 = "evo_rlt.cli.build_transition_cache_v2:main"
evo-rlt-compute-token-variance = "evo_rlt.cli.compute_token_variance:main"
evo-rlt-dataset-viz = "evo_rlt.cli.dataset_viz:main"
evo-rlt-prepare-mix-buckets = "evo_rlt.cli.prepare_mix_buckets:main"
evo-rlt-rescale-cache-reward = "evo_rlt.cli.rescale_cache_reward:main"
evo-rlt-train-actor-critic = "evo_rlt.cli.train_chunk_actor_critic:main"
evo-rlt-train-rl-token = "evo_rlt.cli.train_rl_token:main"
evo-rlt-collect-default = "evo_rlt.adapters.lerobot.record.cli:collect_default_main"
evo-rlt-record = "evo_rlt.adapters.lerobot.record.cli:main"
evo-rlt-online-train = "evo_rlt.adapters.lerobot.record.online_cli:main"
evo-rlt-prune-online-state = "evo_rlt.adapters.lerobot.record.prune_state_cli:main"
evo-rlt-crp-teleop = "evo_rlt.adapters.crp.cli_teleop:main"
evo-rlt-crp-replay = "evo_rlt.adapters.crp.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evo_rlt = ["core/configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
